<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MiniPay</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
    h2 { margin-top: 0; }
    label { display: block; margin-top: 10px; font-size: 14px; color: #333; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 10px 18px; cursor: pointer; }
    .result { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 14px; white-space: pre-wrap; }
    .result.success { background: #e6f4ea; color: #1e4620; }
    .result.error { background: #fdecea; color: #611a15; }
  </style>
</head>
<body>
  <h1>MiniPay</h1>

  <section>
    <h2>Create Payment</h2>
    <label>Customer ID
      <input type="number" id="payment-customer-id" data-testid="payment-customer-id" />
    </label>
    <label>Amount
      <input type="number" step="0.01" id="payment-amount" data-testid="payment-amount" />
    </label>
    <button id="submit-payment" data-testid="submit-payment">Submit Payment</button>
    <div id="payment-result" data-testid="payment-result" class="result" style="display:none;"></div>
  </section>

  <section>
    <h2>Search Transaction</h2>
    <label>Transaction Reference
      <input type="text" id="search-ref" data-testid="search-ref" />
    </label>
    <button id="submit-search" data-testid="submit-search">Search</button>
    <div id="search-result" data-testid="search-result" class="result" style="display:none;"></div>
  </section>

  <script>
    async function createPayment() {
      const customerId = document.getElementById('payment-customer-id').value;
      const amount = document.getElementById('payment-amount').value;
      const resultBox = document.getElementById('payment-result');

      const res = await fetch('/api/payments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customer_id: Number(customerId), amount: Number(amount) }),
      });
      const data = await res.json();

      resultBox.style.display = 'block';
      if (res.ok) {
        resultBox.className = 'result success';
        resultBox.dataset.status = 'success';
        resultBox.textContent = `Success: ${data.transaction_ref} — status ${data.status}`;
      } else {
        resultBox.className = 'result error';
        resultBox.dataset.status = 'error';
        resultBox.textContent = `Error: ${data.detail}`;
      }
    }

    async function searchTransaction() {
      const ref = document.getElementById('search-ref').value;
      const resultBox = document.getElementById('search-result');

      const res = await fetch(`/api/payments/${encodeURIComponent(ref)}`);
      const data = await res.json();

      resultBox.style.display = 'block';
      if (res.ok) {
        resultBox.className = 'result success';
        resultBox.dataset.status = 'success';
        resultBox.textContent = `Found: ${data.transaction_ref} — ${data.amount} — ${data.status}`;
      } else {
        resultBox.className = 'result error';
        resultBox.dataset.status = 'error';
        resultBox.textContent = `Error: ${data.detail}`;
      }
    }

    document.getElementById('submit-payment').addEventListener('click', createPayment);
    document.getElementById('submit-search').addEventListener('click', searchTransaction);
  </script>
</body>
</html>
